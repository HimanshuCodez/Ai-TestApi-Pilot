services:
  - type: web
    name: testpilot-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: testpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: testpilot-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app
      - key: GITHUB_TOKEN
        sync: false

  - type: keyvalue
    name: testpilot-redis
    plan: free
    region: oregon

databases:
  - name: testpilot-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
